<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concept: Poker Table</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #060806; overflow: hidden; height: 100vh; font-family: Georgia, 'Times New Roman', serif; }

  .table-container {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  }
  .felt {
    width: min(900px, 85vw); height: min(480px, 55vh);
    background: radial-gradient(ellipse at 50% 50%, #1a5c2a, #0e3d18 60%, #082a0e 100%);
    border-radius: 220px; position: relative;
    box-shadow: 0 0 0 18px #3a2510, 0 0 0 22px #1a1108, 0 0 80px rgba(0,0,0,.8),
                inset 0 0 60px rgba(0,0,0,.3);
  }
  /* Overhead light */
  .light {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse 60% 50% at 50% 30%, rgba(255,220,140,.08), transparent 70%);
  }
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.85) 100%);
  }

  /* Cards */
  .cards { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 2; }
  .card {
    width: 100px; height: 145px; background: #f8f4ee; border-radius: 8px;
    position: absolute; box-shadow: 2px 4px 20px rgba(0,0,0,.5);
    display: flex; flex-direction: column; padding: 8px; cursor: pointer;
    transition: transform .3s ease;
    animation: cardFloat 3s ease-in-out infinite;
  }
  .card:hover { transform: translateY(-10px) scale(1.04) !important; z-index: 10; }
  .card .rank { font-size: 18px; font-weight: bold; line-height: 1; color: #1a1a1a; }
  .card .rank.red { color: #c0392b; }
  .card .suit { font-size: 14px; margin-top: -2px; }
  .card .suit.red { color: #c0392b; }
  .card .center-suit { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 36px; opacity: .15; }
  .card .label { position: absolute; bottom: 10px; left: 0; right: 0;
    text-align: center; font-size: 9px; letter-spacing: .15em; text-transform: uppercase;
    color: #666; font-family: monospace; }
  .card.face-down {
    background: repeating-conic-gradient(#8b1a1a 0% 25%, #a02020 25% 50%) 50% / 12px 12px;
    border: 3px solid #6b1010;
  }
  .card.face-down .label { color: rgba(255,255,255,.4); bottom: auto; top: 50%;
    transform: translateY(-50%); font-size: 10px; }

  @keyframes cardFloat {
    0%, 100% { translate: 0 0; }
    50% { translate: 0 -6px; }
  }

  /* Chips */
  .chip {
    width: 36px; height: 36px; border-radius: 50%; position: absolute;
    border: 3px dashed rgba(255,255,255,.35);
    box-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  .chip-stack { position: absolute; }
  .chip-stack .chip { position: relative; margin-top: -30px; }
  .chip-stack .chip:first-child { margin-top: 0; }

  /* Text */
  #title {
    position: fixed; top: clamp(30px, 6vh, 60px); left: 0; right: 0; z-index: 5;
    text-align: center; font-size: clamp(36px, 6vw, 72px); font-weight: 400;
    letter-spacing: .12em;
    background: linear-gradient(180deg, #e8d48b, #c9a84c);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: none; filter: drop-shadow(0 2px 12px rgba(200,170,80,.3));
  }
  #tagline {
    position: fixed; top: calc(clamp(30px, 6vh, 60px) + clamp(40px, 6.5vw, 78px));
    left: 0; right: 0; z-index: 5; text-align: center;
    font-style: italic; color: #8a9080; font-size: clamp(12px, 1.5vw, 18px);
    letter-spacing: .06em;
  }
  #annotation {
    position: fixed; bottom: 20px; left: 0; right: 0; z-index: 5;
    text-align: center; color: #2a3020; font-size: 11px; letter-spacing: .12em;
    font-family: monospace;
  }

  /* Particles */
  .dust { position: fixed; width: 2px; height: 2px; border-radius: 50%; pointer-events: none; z-index: 0; }
</style>
</head>
<body>
<div class="vignette"></div>
<div class="light"></div>
<div class="table-container">
  <div class="felt">
    <div class="cards" id="cards"></div>
    <!-- Chip stacks -->
    <div class="chip-stack" style="left:12%;top:18%;">
      <div class="chip" style="background:#c8a84c;"></div>
      <div class="chip" style="background:#c8a84c;"></div>
      <div class="chip" style="background:#c8a84c;"></div>
    </div>
    <div class="chip-stack" style="right:14%;top:22%;">
      <div class="chip" style="background:#c04040;"></div>
      <div class="chip" style="background:#c04040;"></div>
    </div>
    <div class="chip-stack" style="left:18%;bottom:18%;">
      <div class="chip" style="background:#2a2a2a;"></div>
      <div class="chip" style="background:#2a2a2a;"></div>
      <div class="chip" style="background:#2a2a2a;"></div>
      <div class="chip" style="background:#2a2a2a;"></div>
    </div>
    <div class="chip-stack" style="right:20%;bottom:22%;">
      <div class="chip" style="background:#2a8040;"></div>
      <div class="chip" style="background:#2a8040;"></div>
    </div>
  </div>
</div>
<div id="title">LAKSH</div>
<div id="tagline">Read 'em and weep</div>
<div id="annotation">CONCEPT: Poker Table &mdash; scroll deals cards, each card reveals a portfolio section</div>

<script>
const cardData = [
  { rank: 'A', suit: '♠', color: '', label: 'ABOUT', angle: -18, tx: -190 },
  { rank: 'K', suit: '♣', color: '', label: 'PROJECTS', angle: -9, tx: -95 },
  { rank: 'Q', suit: '♥', color: 'red', label: 'CYCLING', angle: 0, tx: 0 },
  { rank: 'J', suit: '♦', color: 'red', label: 'POKER', angle: 9, tx: 95 },
  { rank: '10', suit: '♠', color: '', label: 'TRAVEL', angle: 18, tx: 190 },
  { rank: '', suit: '', color: '', label: 'CONTACT', angle: 28, tx: 280, faceDown: true },
];

const container = document.getElementById('cards');
cardData.forEach((d, i) => {
  const card = document.createElement('div');
  card.className = 'card' + (d.faceDown ? ' face-down' : '');
  card.style.transform = `translateX(${d.tx}px) rotate(${d.angle}deg)`;
  card.style.animationDelay = `${i * .4}s`;
  card.style.zIndex = i;
  if (!d.faceDown) {
    card.innerHTML = `
      <span class="rank ${d.color}">${d.rank}</span>
      <span class="suit ${d.color}">${d.suit}</span>
      <span class="center-suit">${d.suit}</span>
      <span class="label">${d.label}</span>
    `;
  } else {
    card.innerHTML = `<span class="label">${d.label}</span>`;
  }
  container.appendChild(card);
});

// Floating dust particles
for (let i = 0; i < 25; i++) {
  const d = document.createElement('div');
  d.className = 'dust';
  d.style.left = Math.random() * 100 + '%';
  d.style.top = Math.random() * 100 + '%';
  d.style.background = `rgba(200,180,120,${Math.random() * .15 + .05})`;
  d.style.animation = `cardFloat ${3 + Math.random() * 4}s ease-in-out infinite`;
  d.style.animationDelay = `${Math.random() * 5}s`;
  document.body.appendChild(d);
}
</script>
</body>
</html>
