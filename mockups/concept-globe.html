<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concept: 3D Globe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #020208; overflow: hidden; height: 100vh; font-family: 'SF Mono', 'Menlo', monospace; color: #f5f6f7; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(2,2,8,.85) 100%);
  }
  #overlay {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    display: flex; align-items: center; padding-left: clamp(40px, 8vw, 120px);
  }
  #text-block { max-width: 400px; }
  #text-block h1 {
    font-size: clamp(48px, 8vw, 96px); font-weight: 200; letter-spacing: .15em;
    color: #f5f6f7; line-height: .9;
    text-shadow: 0 0 40px rgba(53,224,208,.15);
  }
  #text-block p {
    margin-top: 18px; font-size: clamp(11px, 1.2vw, 14px);
    letter-spacing: .22em; color: #607080; text-transform: uppercase;
  }
  #annotation {
    position: fixed; bottom: 20px; left: 0; right: 0; z-index: 4;
    text-align: center; color: #2a3040; font-size: 11px; letter-spacing: .12em;
    font-family: monospace;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="overlay"><div id="text-block">
  <h1>LAKSH</h1>
  <p>Developer &bull; Cyclist &bull; Explorer</p>
</div></div>
<div id="annotation">CONCEPT: 3D Globe &mdash; scroll zooms from orbit to street level for each section</div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
let W, H;
function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
resize(); addEventListener('resize', resize);

const PI = Math.PI, TAU = PI * 2;
const stars = Array.from({length: 400}, () => ({
  x: Math.random(), y: Math.random(), s: Math.random() * 1.2 + .3,
  tw: Math.random() * TAU, sp: Math.random() * 1.5 + .5
}));

// Cities: [lat, lon, name]
const cities = [
  [37.7, -122.4, 'San Francisco'], [40.7, -74.0, 'New York'],
  [51.5, -0.1, 'London'], [25.2, 55.3, 'Dubai'],
  [35.7, 139.7, 'Tokyo'], [19.0, 72.8, 'Mumbai'],
  [-33.9, 151.2, 'Sydney'], [1.3, 103.8, 'Singapore'],
  [48.9, 2.3, 'Paris'], [-33.9, 18.4, 'Cape Town']
];
const arcs = [[0,1],[1,2],[2,3],[3,5],[5,7],[7,4],[4,0],[2,8],[3,9],[5,6]];

function latLon3D(lat, lon, rot) {
  const phi = (90 - lat) * PI / 180, theta = (lon + rot) * PI / 180;
  return {
    x: Math.sin(phi) * Math.cos(theta),
    y: Math.cos(phi),
    z: Math.sin(phi) * Math.sin(theta)
  };
}

function project(p, cx, cy, r) {
  return { x: cx + p.x * r, y: cy - p.y * r, z: p.z, visible: p.z > -0.1 };
}

function drawStars(t) {
  stars.forEach(s => {
    const a = (Math.sin(t * s.sp + s.tw) + 1) / 2 * .5 + .3;
    ctx.fillStyle = `rgba(180,200,220,${a})`;
    ctx.fillRect(s.x * W, s.y * H, s.s > 1 ? 1.5 : 1, s.s > 1 ? 1.5 : 1);
  });
}

function drawGlobe(t) {
  const cx = W * .62, cy = H * .48;
  const R = Math.min(W, H) * .32;
  const rot = t * 12; // degrees

  // Ambient glow
  const glow = ctx.createRadialGradient(cx, cy, R * .2, cx, cy, R * 1.6);
  glow.addColorStop(0, 'rgba(53,224,208,.06)');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // Parallels
  ctx.strokeStyle = 'rgba(53,224,208,.12)';
  ctx.lineWidth = .8;
  for (let lat = -60; lat <= 60; lat += 20) {
    const pts = [];
    for (let lon = 0; lon <= 360; lon += 4) {
      const p = latLon3D(lat, lon, rot);
      const s = project(p, cx, cy, R);
      if (s.visible) pts.push(s);
      else { if (pts.length > 1) { ctx.beginPath(); pts.forEach((pt, i) => i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y)); ctx.stroke(); } pts.length = 0; }
    }
    if (pts.length > 1) { ctx.beginPath(); pts.forEach((pt, i) => i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y)); ctx.stroke(); }
  }
  // Equator brighter
  ctx.strokeStyle = 'rgba(53,224,208,.25)';
  ctx.lineWidth = 1;
  const eqPts = [];
  for (let lon = 0; lon <= 360; lon += 3) {
    const p = latLon3D(0, lon, rot);
    const s = project(p, cx, cy, R);
    if (s.visible) eqPts.push(s);
    else { if (eqPts.length > 1) { ctx.beginPath(); eqPts.forEach((pt, i) => i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y)); ctx.stroke(); } eqPts.length = 0; }
  }
  if (eqPts.length > 1) { ctx.beginPath(); eqPts.forEach((pt, i) => i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y)); ctx.stroke(); }

  // Meridians
  ctx.strokeStyle = 'rgba(53,224,208,.1)';
  ctx.lineWidth = .6;
  for (let lon = 0; lon < 360; lon += 20) {
    const pts = [];
    for (let lat = -90; lat <= 90; lat += 4) {
      const p = latLon3D(lat, lon, rot);
      const s = project(p, cx, cy, R);
      if (s.visible) pts.push(s);
      else { if (pts.length > 1) { ctx.beginPath(); pts.forEach((pt, i) => i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y)); ctx.stroke(); } pts.length = 0; }
    }
    if (pts.length > 1) { ctx.beginPath(); pts.forEach((pt, i) => i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y)); ctx.stroke(); }
  }

  // Outline circle
  ctx.strokeStyle = 'rgba(53,224,208,.2)';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();

  // Arcs
  arcs.forEach(([ai, bi]) => {
    const ca = cities[ai], cb = cities[bi];
    const pa = project(latLon3D(ca[0], ca[1], rot), cx, cy, R);
    const pb = project(latLon3D(cb[0], cb[1], rot), cx, cy, R);
    if (!pa.visible || !pb.visible) return;
    const mx = (pa.x + pb.x) / 2, my = (pa.y + pb.y) / 2;
    const dist = Math.hypot(pb.x - pa.x, pb.y - pa.y);
    const lift = dist * .35;
    ctx.strokeStyle = 'rgba(245,166,35,.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(pa.x, pa.y);
    ctx.quadraticCurveTo(mx, my - lift, pb.x, pb.y);
    ctx.stroke();
    // Traveling pulse
    const pt = (t * .3 + ai * .1) % 1;
    const px = (1-pt)*(1-pt)*pa.x + 2*(1-pt)*pt*mx + pt*pt*pb.x;
    const py = (1-pt)*(1-pt)*pa.y + 2*(1-pt)*pt*(my-lift) + pt*pt*pb.y;
    ctx.fillStyle = '#f5a623';
    ctx.beginPath(); ctx.arc(px, py, 2.5, 0, TAU); ctx.fill();
  });

  // City dots
  cities.forEach((city, i) => {
    const p = latLon3D(city[0], city[1], rot);
    const s = project(p, cx, cy, R);
    if (!s.visible) return;
    const pulse = Math.sin(t * 2 + i) * .5 + 1.5;
    // Glow
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 8 * pulse);
    g.addColorStop(0, 'rgba(53,224,208,.7)');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(s.x, s.y, 8 * pulse, 0, TAU); ctx.fill();
    // Dot
    ctx.fillStyle = '#35e0d0';
    ctx.beginPath(); ctx.arc(s.x, s.y, 2.5, 0, TAU); ctx.fill();
    // Label
    const alpha = Math.max(0, Math.min(1, (s.z + .1) * 2));
    ctx.fillStyle = `rgba(140,160,180,${alpha * .7})`;
    ctx.font = '9px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(city[2], s.x + 8, s.y + 3);
  });
}

function frame(ts) {
  const t = ts / 1000;
  ctx.clearRect(0, 0, W, H);
  drawStars(t);
  drawGlobe(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
